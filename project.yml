name: SENSXIOS

options:
  bundleIdPrefix: com.sensx
  deploymentTarget:
    iOS: "16.0"

targets:
  SENSXIOS:
    type: application
    platform: iOS
    sources:
      - path: AIMXIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensx.ios
        PRODUCT_NAME: SENSXIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "SENS X IOS"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    info:
      path: Generated/Info.plist
      properties:
        LSApplicationQueriesSchemes:
          - freefire
          - freefiremobile
          - freefiremax
          - freefiremaxmobile
