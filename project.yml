name: SENSXIOS
options:
  bundleIdPrefix: com.sensx
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SENSXIOS:
    type: application
    platform: iOS
    sources:
      - path: AIMXIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensx.ios
        PRODUCT_NAME: SENSXIOS
        INFOPLIST_KEY_CFBundleDisplayName: "SENS X IOS"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
    info:
      properties:
        LSApplicationQueriesSchemes:
          - freefire
          - freefiremobile
          - freefiremax
          - freefiremaxmobile
