name: Build unsigned SENS X IOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract ZIP if uploaded to repository
        shell: bash
        run: |
          set +e
          ZIP_PATH=""
          for f in \
            "xit-ios.zip" \
            "xit ios.zip" \
            "GITHUB_UPLOAD/xit-ios.zip" \
            "GITHUB_UPLOAD/xit ios.zip"; do
            if [ -f "$f" ]; then
              ZIP_PATH="$f"
              break
            fi
          done

          if [ -n "$ZIP_PATH" ]; then
            echo "Found zip archive: $ZIP_PATH"
            unzip -o "$ZIP_PATH" -d .
            echo "Extraction completed."
          else
            echo "No zip archive found in repo root or GITHUB_UPLOAD. Continuing with repository files."
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Debug repo layout before XcodeGen
        shell: bash
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "---"
          if [ -d "AIMXIOS" ]; then echo "AIMXIOS directory: OK"; else echo "AIMXIOS directory: MISSING"; fi
          if [ -f "project.yml" ]; then echo "project.yml: OK"; else echo "project.yml: MISSING"; fi
          echo "---"
          find . -maxdepth 2 -type d | sort | head -200

      - name: Generate Xcode project
        run: xcodegen generate --spec ./project.yml

      - name: Build for iPhone and iPad
        run: >-
          xcodebuild
          -project SENSXIOS.xcodeproj
          -scheme SENSXIOS
          -configuration Release
          -sdk iphoneos
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/SENSXIOS.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/SENSXIOS.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/SENSXIOS-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SENSXIOS-unsigned-IPA
          path: SENSXIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
